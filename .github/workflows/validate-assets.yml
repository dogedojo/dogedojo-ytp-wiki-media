name: Validate media assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest and asset files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate asset manifest
        run: python scripts/validate_manifest.py
